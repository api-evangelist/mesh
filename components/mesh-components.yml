  kind: hosted-embeddable-ux
  description: "Hosted connection/transfer/verify flow. Handles OAuth flows, wallet connections, transfer previews, compliance steps, and success/error states. Loaded from *.meshconnect.com (web iframe hosted at web.meshconnect.com)."
  platforms:
