  - platform: react-native
    loader: "@meshconnect/react-native-link-sdk"
    package: https://www.npmjs.com/package/@meshconnect/react-native-link-sdk
  - platform: flutter
    loader: mesh_sdk_flutter (pub.dev)
    package: https://pub.dev/packages/mesh_sdk_flutter
  integration_notes:
