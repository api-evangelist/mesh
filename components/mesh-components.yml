source: https://docs.meshconnect.com/resources/concepts
notes: >-
  Mesh's client-side surface is "Link" — a hosted, embeddable UX (iframe on web, native
  view on mobile) that facilitates connecting accounts, initiating transfers, and
  verifying wallets. It is launched with a server-minted Link Token and driven via
  callback functions. Distinct from the server-side Node API client in packages/.
families:
