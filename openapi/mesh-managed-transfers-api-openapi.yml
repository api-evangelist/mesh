openapi: 3.2.0
info:
  title: Mesh Connect Integration Managed Transfers API
  description: 'Mesh allows users to connect accounts of financial institutions,

    crypto exchanges, and self-custody wallets. Mesh handles credential

    validation, MFA, and error handling for each integration. After

    an account is connected, Mesh allows client applications to read holdings,

    transaction history and balances and execute crypto transfers (with user approval).'
  version: '1.0'
servers:
- url: https://integration-api.meshconnect.com
- url: https://sandbox-integration-api.meshconnect.com
security:
- Client-Secret: []
  Client-Id: []
tags:
- name: Managed Transfers
paths:
  /api/v1/transfers/managed/networks:
    get:
      tags:
      - Managed Transfers
      summary: Get networks
      description: '**Get supported networks list.**


        ---

        Get the list of all networks supported by Mesh to perform transfers, including which tokens and integrations are supported.


        The response always includes validation data:

        - `addressPattern`: The regex pattern for validating addresses on this network

        - `contractAddress`: For each token, the contract address (if applicable) to enable ERC20 contract address validation

        - `requiresAddressTag`: Whether a deposit to this network must carry a destination tag/memo (`addressTag`),

        e.g. XRP Ledger, Stellar or Cosmos-family networks. Funds sent without the tag may be lost. Just-in-Time (JIT)

        address providers must return `addressTag` for these networks, or Mesh rejects the address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkModelResponseApiResult'
              example:
                content:
                  networks:
                  - networkType: evm
                    tokens:
                    - symbol: ETH
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/tokens/ETH.svg
                    - symbol: USDC
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/tokens/USDC.svg
                      contractAddress: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
                    - symbol: USDT
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/tokens/USDT.svg
                      contractAddress: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
                    supportedBrokerTypes:
                    - deFiWallet
                    - robinhood
                    - coinbase
                    - kraken
                    - binanceInternational
                    - binanceUs
                    addressPattern: ^0x[a-fA-F0-9]{40}$
                    requiresAddressTag: false
                    supportedTokens:
                    - ETH
                    - USDC
                    - USDT
                    nativeSymbol: ETH
                    id: e3c7fdd8-b1fc-4e51-85ae-bb276e075611
                    name: Ethereum
                    chainId: '1'
                    logoUrl: https://file-cdn.meshconnect.com/public/logos/networks/Ethereum.svg
                  - networkType: stellar
                    tokens:
                    - symbol: XLM
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/tokens/XLM.svg
                    supportedBrokerTypes:
                    - coinbase
                    - kraken
                    - binanceInternational
                    addressPattern: ^G[a-zA-Z0-9]{55}$
                    requiresAddressTag: true
                    supportedTokens:
                    - XLM
                    nativeSymbol: XLM
                    id: 06855704-43d2-4ad2-a73c-372f0c3534e1
                    name: Stellar
                    logoUrl: https://file-cdn.meshconnect.com/public/logos/networks/Stellar.svg
                status: ok
                message: ''
                errorHash: 3904604d
                teamCode: P4
                errorType: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {}
      operationId: getApiV1TransfersManagedNetworks
      x-operation-id-source: derived
  /api/v1/transfers/managed/integrations:
    get:
      tags:
      - Managed Transfers
      summary: Get integrations
      description: '**Get supported integrations list.**


        ---

        Get the list of all integrations supported by Mesh to perform transfers, including which tokens and networks are supported.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationNetworkResponseApiResult'
              example:
                content:
                  integrations:
                  - id: 00000000-0000-0000-0000-000000000000
                    type: robinhood
                    networks:
                    - supportedDevices:
                      - android
                      - ios
                      - web
                      supportedTokens:
                      - USDC
                      - ETH
                      nativeSymbol: ETH
                      id: e3c7fdd8-b1fc-4e51-85ae-bb276e075611
                      name: Ethereum
                      chainId: '1'
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/networks/Ethereum.svg
                    - supportedDevices:
                      - web
                      supportedTokens:
                      - MATIC
                      - ETH
                      nativeSymbol: MATIC
                      id: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                      name: Polygon
                      chainId: '137'
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/networks/Polygon.svg
                    supportsOutgoingTransfers: true
                    supportsIncomingTransfers: true
                status: ok
                message: ''
                errorHash: 844500ab
                teamCode: P4
                errorType: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {}
      operationId: getApiV1TransfersManagedIntegrations
      x-operation-id-source: derived
  /api/v1/transfers/managed/tokens:
    get:
      tags:
      - Managed Transfers
      summary: Get supported tokens
      description: Get the list of all tokens supported by Mesh to perform transfers, including which networks and integrations are supported.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenNetworksResponseApiResult'
              example:
                content:
                  tokens:
                  - token: ADA
                    networks:
                    - isTracked: false
                      id: f7a660cd-bac0-4ae8-8ddb-c54d321b55dc
                      name: Cardano
                      logoUrl: https://file-cdn.meshconnect.com/public/logos/networks/Cardano.svg
                    supportedIntegrations:
                    - gemini
                    - binanceInternational
                status: ok
                message: ''
                errorHash: '35664305'
                teamCode: P4
                errorType: ''
      operationId: getApiV1TransfersManagedTokens
      x-operation-id-source: derived
  /api/v1/transfers/managed/verify:
    get:
      tags:
      - Managed Transfers
      summary: Verify the transfer request without authenticating the integration accounts
      description: 'Checks if the combination of integration ID, network ID, token is correct for transfer.

        Checks if the target address is in the correct format.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransferVerificationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferVerificationResponseApiResult'
              example:
                content:
                  status: succeeded
                  errorMessage: transfer request verification is successful
                status: ok
                message: ''
                errorHash: 5e4958bf
                teamCode: P4
                errorType: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                status: badRequest
                message: Error message
                displayMessage: Optional display message
                errorHash: 7dcbb73d
                teamCode: P4
                errorType: missingField
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {}
      operationId: getApiV1TransfersManagedVerify
      x-operation-id-source: derived
  /api/v1/transfers/managed/configure:
    post:
      tags:
      - Managed Transfers
      summary: Configure transfer
      description: '**Get the list of networks and tokens eligible for a transfer, based on the provided request data.**


        ---

        The API client provides `FromAuthToken` that represents the source account and the list of target addresses

        using the `ToAddresses` field. Front API verifies the addresses and returns the list of tokens eligible

        to be transferred as the result of the operation.


        Returns the list of holdings on the account that can be used to perform the transfer. Each holdings item

        contains the list of supported networks that can be used to transfer the corresponding asset.

        Each network contains details such as gas fees and the amount eligible to be transferred.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ConfigureTransferRequest'
            examples:
              Configure with provided list of addresses:
                value:
                  isInclusiveFeeEnabled: false
                  fromAuthToken: Secret authentication token
                  fromType: robinhood
                  toAddresses:
                  - networkId: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                    symbol: USDT
                    address: '0x9Bf6207f8A3f4278E0C989527015deFe10e5D7c6'
                  - networkId: 0291810a-5947-424d-9a59-e88bb33e999d
                    symbol: USDT
                    address: HN7cABqLq46Es1jh92dQQisAq662SmxELLLsHHe4YWrH
                  - networkId: 0880db06-7c7c-4738-898f-cf74efc03c47
                    symbol: BTC
                    address: 3FZbgi29cpjq2GjdwV8eyHuJJnkLtktZc5
              Configure with provided list of addresses, symbol and amount:
                value:
                  isInclusiveFeeEnabled: false
                  fromAuthToken: Secret authentication token
                  fromType: robinhood
                  toAddresses:
                  - networkId: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                    symbol: USDT
                    address: '0x9Bf6207f8A3f4278E0C989527015deFe10e5D7c6'
                  - networkId: 0291810a-5947-424d-9a59-e88bb33e999d
                    symbol: USDT
                    address: HN7cABqLq46Es1jh92dQQisAq662SmxELLLsHHe4YWrH
                  - networkId: 0880db06-7c7c-4738-898f-cf74efc03c47
                    symbol: BTC
                    address: 3FZbgi29cpjq2GjdwV8eyHuJJnkLtktZc5
                  symbol: USDT
                  amount: 130
                  fiatCurrency: USD
              Configure with provided list of addresses, symbol, amount in fiat and preferred network:
                value:
                  isInclusiveFeeEnabled: false
                  fromAuthToken: Secret authentication token
                  fromType: robinhood
                  toAddresses:
                  - networkId: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                    symbol: USDT
                    address: '0x9Bf6207f8A3f4278E0C989527015deFe10e5D7c6'
                  - networkId: 0291810a-5947-424d-9a59-e88bb33e999d
                    symbol: USDT
