      properties:
        id:
          type: string
          description: Mesh transfer identifier.
          format: uuid
        meshTransferId:
          type:
          - string
          - 'null'
          description: "The verbatim MFS (mesh-services) transfer id, when this transfer was sourced\nfrom MFS rather than the legacy FBE store. null for every\nlegacy FBE transfer, and omitted from JSON responses entirely\n(`DefaultIgnoreCondition = WhenWritingNull`), so this is additive for\nexisting consumers.\n            \n\n<b>Why this exists.</b> MFS mints transfer ids as free-form strings —\n`transfer-{guid:N}` from the crypto/DeFi register and quote paths, and\n`ramp_{guid}` from the fiat ramp path — and `transfers.transfer_id` is\na `text` primary key, not a `uuid`. Org.Front.Core.Contracts.Models.ManagedTransfers.BaseTransferModel.Id is a\nSystem.Guid and is the shared v1 contract, so the union derives\nOrg.Front.Core.Contracts.Models.ManagedTransfers.BaseTransferModel.Id from the MFS id (see the mesh-internal adapter's\n`MeshTransferIdGuidConverter`) and keeps the original here. That\nderivation is one-way in the general case, so this is the ONLY field that\nround-trips back to MFS — use it, not Org.Front.Core.Contracts.Models.ManagedTransfers.BaseTransferModel.Id, for any MFS drill-down,\nsupport lookup or cross-system correlation.\n\n<b>Why `set` and not `init`, unlike every other property here.</b> Do\nnot \"fix\" this — it will break the mesh-internal adapter. The wire carries this\nvalue under `id`, the same JSON property that populates Org.Front.Core.Contracts.Models.ManagedTransfers.BaseTransferModel.Id,\nand System.Text.Json cannot bind one JSON property to two CLR properties. So the\nadapter deserialises normally (the id converter derives Org.Front.Core.Contracts.Models.ManagedTransfers.BaseTransferModel.Id) and\nthen assigns this from the raw payload, which an `init` accessor would\nforbid. It is the only mutable member on this type and is written in exactly one\nplace: `MeshInternalTransfersJson.ParseResponse`.\n\n\nThe System.Text.Json.Serialization.JsonIgnoreAttribute is what makes this additive rather than a\nvisible contract change: without it, omission would depend on each host setting\n`DefaultIgnoreCondition = WhenWritingNull` globally. All three API hosts do\ntoday, but this type lives in Core.Contracts and is serialized by more than the\nMVC pipeline, so enforce it on the model instead of trusting every present and\nfuture caller. Deserialization is unaffected — the condition only governs writes.\n"
