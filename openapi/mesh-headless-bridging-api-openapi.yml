      - integrator
      - subsidized
      - providerAggregate
      - other
      type: string
    GetBridgingQuoteRequest:
      required:
      - amount
      - destination
      - origin
      type: object
      properties:
        origin:
          allOf:
          - $ref: '#/components/schemas/BridgingDestinationSpec'
          description: 'The pay-in leg: network and asset that will be sent to the bridging address.

            Must match a configured route from deposit or withdrawal route discovery.'
        destination:
          allOf:
          - $ref: '#/components/schemas/BridgingDestinationWithAddressSpec'
          description: 'The payout leg: network, asset, and the address that will receive the bridged funds.

            Must match a route from deposit or withdrawal route discovery together with `origin`.'
        amount:
          maximum: 1000000000
          minimum: 1.0e-18
          type: number
          description: 'Amount to be sent, denominated in the `origin` asset (e.g. `100` for 100 USDC).

            Must be greater than zero and at most 1,000,000,000.'
          format: double
      additionalProperties: false
      description: 'Request body for `POST /api/v1/bridging/quote`.



        Prices a bridge for a caller-supplied pay-in amount without minting a deposit address or creating a

        transfer. Call it while the end user is still choosing an amount; call `POST /api/v1/bridging/address`

        only once they confirm.



        The result is indicative. The deposit address returned by `/address` accepts any amount and the

        bridge provider prices what actually arrives at fill time.

        '
    BridgingQuoteConstraintsDto:
      required:
      - minimumAmount
      type: object
      properties:
        minimumAmount:
          type:
          - string
          - 'null'
          description: 'Minimum pay-in amount as a decimal string in the origin asset: the stricter of the route minimum and the

            platform USD floor converted at the current price. `"0"` when neither applies.'
        maximumAmount:
          type:
          - string
          - 'null'
          description: 'Maximum pay-in amount as a decimal string in the origin asset: the platform USD cap converted at the current

            price. An `amount` above it is rejected with `amountExceedsMaximum`; the provider''s available

            liquidity may be lower and is reported the same way. `null` when no platform maximum can be expressed

            (serialized as JSON `null` despite global omit-null settings).'
      additionalProperties: false
      description: Pay-in amount limits attached to a headless bridging quote, in the origin asset.
    HeadlessBridgingRouteInfo:
