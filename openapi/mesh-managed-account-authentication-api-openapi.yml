                $ref: '#/components/schemas/B2BBrokersHealthStatusListApiResult'
              example:
                content:
                - type: robinhood
                  name: Robinhood
                  isUp: true
                  supportedProducts:
                  - balance
                  - holdings
                  - identity
                  - orders
                  - transfers
                - type: celsius
                  name: Celsius
                  isUp: false
                  description: Temporarily disabled
                  downTimeStart: 1655891444
                  supportedProducts:
                  - balance
                  - orders
                  - transfers
                  - holdings
                - type: deFiWallet
                  name: MetaMask
                  isUp: false
                  supportedProducts:
                  - transfers
                  - holdings
                  deFiWalletData:
                    id: 34aeb688-decb-485f-9d80-b66466783394
                    name: MetaMask
                status: ok
                message: ''
                errorHash: f585284a
                teamCode: P4
                errorType: ''
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {}
      deprecated: true
      operationId: getApiV1Status
      x-operation-id-source: derived
