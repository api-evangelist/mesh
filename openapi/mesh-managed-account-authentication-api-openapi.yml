          description: 'Withdrawal only, and required for it: the assets and networks your custodian can pay the

            withdrawal from, 1 to 20 entries, each with its own `maxAmount`. Link offers the user the

            destinations Mesh can deliver to from these pairs. Do not send `toAddresses` or

            `amountInFiat` with a withdrawal.'
        amountInFiat:
          type:
          - number
          - 'null'
          description: Amount in USD to transfer. If not provided users can specify amount by themselves.
          format: double
