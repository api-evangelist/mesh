                      address: '0x00000000000000000000000'
                    - networkId: e3c7fdd8-b1fc-4e51-85ae-bb276e075611
                      symbol: USDC
                      address: '0x00000000000000000000000'
                    - networkId: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                      symbol: MATIC
                      address: '0x00000000000000000000000'
                    - networkId: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                      symbol: USDC
                      address: '0x00000000000000000000000'
                    amountInFiat: 10
                    isInclusiveFeeEnabled: false
                    generatePayLink: false
                  disableApiKeyGeneration: false
              Withdrawal:
                value:
                  userId: UserId
                  restrictMultipleAccounts: false
                  transferOptions:
                    fromPairs:
                    - networkId: 0291810a-5947-424d-9a59-e88bb33e999d
                      symbol: USDC
                      maxAmount: 99.99
                    - networkId: e3c7fdd8-b1fc-4e51-85ae-bb276e075611
                      symbol: USDC
                      maxAmount: 99.99
                    - networkId: aa883b03-120d-477c-a588-37c2afd3ca71
                      symbol: USDC
                      maxAmount: 99.99
                    transactionId: TransactionId
                    transferType: withdrawal
                    isInclusiveFeeEnabled: false
                    generatePayLink: false
                  disableApiKeyGeneration: false
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/GetLinkTokenRequest'
            examples:
              Deposit:
                value:
                  userId: UserId
                  configurationId: 18a20b11-e47f-43b9-8546-94284e9ee547
                  restrictMultipleAccounts: true
                  transferOptions:
                    toAddresses:
                    - networkId: e3c7fdd8-b1fc-4e51-85ae-bb276e075611
                      symbol: ETH
                      address: '0x00000000000000000000000'
                    - networkId: e3c7fdd8-b1fc-4e51-85ae-bb276e075611
                      symbol: USDC
                      address: '0x00000000000000000000000'
                    - networkId: 7436e9d0-ba42-4d2b-b4c0-8e4e606b2c12
                      symbol: MATIC
