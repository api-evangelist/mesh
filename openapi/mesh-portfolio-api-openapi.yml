    ```DeFiWallet```'
paths:
  /api/v1/holdings/get:
    post:
      tags:
      - Portfolio
      summary: Get crypto holdings
      description: Obtain assets from the connected investment account. Performs realtime API call to the underlying integration.
      requestBody:
        description: Request containing authentication token
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PortfolioHoldingsRequest'
      responses:
        '200':
          description: Holdings obtained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldingsModelApiResult'
              examples:
                Trading platform example:
                  value:
                    content:
                      equityPositions:
                      - symbol: AAPL
                        amount: 3
                        costBasis: 109
                      - symbol: F
                        amount: 27
                        costBasis: 7.05791
                      cryptocurrencyPositions:
                      - marketValue: 75.15
                        lastPrice: 0.05
                        symbol: DOGE
                        amount: 1503
                        costBasis: 0.033
                      - symbol: BTC
                        amount: 3.0001672
                        costBasis: 18000
                      status: succeeded
                      errorMessage: ''
                      displayMessage: ''
                      notSupportedEquityPositions:
                      - symbol: CUSIP38259P508
                        amount: 1
                      notSupportedCryptocurrencyPositions: []
                      nftPositions: []
                      optionPositions: []
                      type: robinhood
                      accountId: 5FUVPB0
                      institutionName: Robinhood
                      accountName: Margin account
                    status: ok
                    message: ''
                    errorHash: a394c021
                    teamCode: P4
                    errorType: ''
                Self-custody cryptocurrency wallet example:
                  value:
                    content:
                      equityPositions: []
                      cryptocurrencyPositions:
                      - marketValue: 75.15
                        lastPrice: 0.05
                        symbol: DOGE
                        amount: 1503
                        costBasis: 0.033
                        distribution:
                        - caipNetworkId: eip155:1
                          address: '0x1111111111111111111111111111111111111111'
                          amount: 1500
                        - caipNetworkId: eip155:42161
                          address: '0x1111111111111111111111111111111111111111'
                          amount: 3
                      - symbol: BTC
                        amount: 3.0001672
                        costBasis: 18000
                        distribution:
                        - caipNetworkId: bip122:000000000019d6689c085ae165831e93
                          address: bc1q5cyxnuxmeuwuvkwfem96lxyepd5t0gd5nqf6h4
                          amount: 1
                        - caipNetworkId: bip122:000000000019d6689c085ae165831e93
                          address: bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf7du0
                          amount: 1
                        - caipNetworkId: bip122:000000000019d6689c085ae165831e93
                          address: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
                          amount: 1.0001672
                      status: succeeded
                      errorMessage: ''
                      displayMessage: ''
                      notSupportedEquityPositions: []
                      notSupportedCryptocurrencyPositions: []
                      nftPositions: []
                      optionPositions: []
                      type: deFiWallet
                      accountId: 8c02d545753b596075ecbc20e2b7d3fb5b380c52
                      institutionName: DeFiWallet
                      accountName: MetaMask wallet
                    status: ok
                    message: ''
                    errorHash: a394c021
                    teamCode: P4
                    errorType: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                status: badRequest
                message: Error message
                displayMessage: Optional display message
                errorHash: 7dcbb73d
                teamCode: P4
                errorType: missingField
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or missing.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have read permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
      operationId: postApiV1HoldingsGet
      x-operation-id-source: derived
  /api/v1/holdings/value:
    post:
      tags:
      - Portfolio
      summary: Get holdings values
      description: 'Obtain assets from the connected investment account and return total value and performance.

        Performs realtime API call to the underlying integration.'
      requestBody:
        description: Request with authentication token.
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PortfolioBrokerBaseRequest'
            example:
              authToken: Secret authentication token
              type: binanceInternationalDirect
      responses:
        '200':
          description: Market values of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerPortfolioValueModelApiResult'
              example:
                content:
                  totalValue: 186.03
                  totalPerformance: 6.23
                  equitiesValue: 100.12
                  equitiesPerformance: 5.3457
                  cryptocurrenciesValue: 50.37
                  cryptocurrenciesPerformance: 7.23
                  nftsValue: 15.34
                  fiatValue: 20.2
                status: ok
                message: ''
                errorHash: f2b4f62e
                teamCode: P4
                errorType: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                status: badRequest
                message: Error message
                displayMessage: Optional display message
                errorHash: 7dcbb73d
                teamCode: P4
                errorType: missingField
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or missing.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have read permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
      operationId: postApiV1HoldingsValue
      x-operation-id-source: derived
  /api/v1/holdings/portfolio:
    get:
      tags:
      - Portfolio
      summary: Get aggregated portfolio
      description: Get the aggregated portfolio of the user containing market values.
