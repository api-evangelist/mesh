openapi: 3.2.0
info:
  title: Mesh Connect Integration Transfers API
  description: 'Mesh allows users to connect accounts of financial institutions,

    crypto exchanges, and self-custody wallets. Mesh handles credential

    validation, MFA, and error handling for each integration. After

    an account is connected, Mesh allows client applications to read holdings,

    transaction history and balances and execute crypto transfers (with user approval).'
  version: '1.0'
servers:
- url: https://integration-api.meshconnect.com
- url: https://sandbox-integration-api.meshconnect.com
security:
- Client-Secret: []
  Client-Id: []
tags:
- name: Transfers
  description: '### Supported integrations:

    ```Robinhood```

    ```Coinbase```

    ```Kraken```

    ```CryptoCom```

    ```Binance```

    ```Gemini```

    ```OkCoin```

    ```KuCoin```

    ```BinanceInternational```

    ```Bitstamp```

    ```GateIo```

    ```Okx```

    ```Huobi```

    ```Bitfinex```

    ```KrakenDirect```

    ```BinanceInternationalDirect```

    ```BitfinexDirect```

    ```Bybit```

    ```Paxos```

    ```CoinbasePrime```

    ```BtcTurkDirect```

    ```ParibuDirect```

    ```RobinhoodConnect```

    ```BlockchainCom```

    ```BinanceConnect```

    ```RevolutConnect```

    ```BinancePay```

    ```BybitDirect```

    ```ParibuOAuth```

    ```PayPalConnect```

    ```CoinbaseRamp```

    ```BybitDirectMobile```

    ```Sandbox```

    ```CryptoComPay```

    ```Uphold```

    ```BinancePayOnchain```

    ```SandboxCoinbase```

    ```BybitPay```

    ```CashApp```

    ```SandboxKrakenOAuth```

    ```KrakPay```

    ```OkxPay```

    ```BybitPayPsp```

    ```DeFiWallet```


    ### Integration-specific notes:


    #### Robinhood:


    Cryptocurrency transfers should be enabled in Robinhood settings. Transfers are disabled by default, enabling them for end users requires a review from Robinhood. Please note:

    * `MfaCode` parameter is required to initiate a transaction in Robinhood. * The user''s security settings should be configured to use an authenticator application. * Robinhood doesn''t allow initiation of transactions if the authenticator application is not configured. #### Coinbase:


    `MfaCode` parameter should be used to initiate transactions in Coinbase. * If the end user''s Coinbase account is configured to use text messages (SMS) for two factor authentication, the API will return `MfaRequired` status, and a text code will then be sent by Coinbase. The code is expected to be provided in the subsequent call using the `MfaCode` request field

    * If the account is configured to use an authenticator application, the API is expecting to get the code in the `MfaCode` request field. #### Kraken:


    Kraken requires the explicit chain name to be provided (e.g. `Dogecoin` or `Ethereum (ERC20)`). The list of possible chains can be obtained by calling `symbol/details` endpoint. To initiate a transaction, a Kraken Address Key name should be provided in `TargetAddress` field. Target address should be added using Kraken UI, then its name should be used. #### Binance:


    `Enable Withdrawals` permission should be given to the user''s API key to initiate transfers with Binance Us. Binance requires adding the IP address to the list of trusted IPs to be able to create API keys with transfer permission. * Please reach out to Front to get the static IP address. This address should be provided to the end user, and the user should be instructed to add it to the list of trusted IP addresses. * By default, the permission to enable withdrawals is turned off. If the end user''s API key does not have the permission, asset transfers will not be available. #### KuCoin:


    KuCoin requires adding the IP address to the list of trusted IPs to be able to create API keys with transfer permission. `Fee` parameter should be used to initiate a transaction in KuCoin. Please note:

    * Please reach out to Front to get the static IP address. This address should be provided to the end user, and the user should be instructed to add it to the list of trusted IP addresses. * All currencies have their minimum `fee` and `amount` requirements. Please use `symbol/details` endpoint to get this data for a particular symbol. * KuCoin requires chain name to be provided for getting deposit address or initiating a cryptocurrency transfer. Some cryptocurrencies are supported over multiple chains. It''s recommended to use `symbol/details` endpoint to get the list of supported chains and show it to the end user to select a target one. #### BinanceInternational:


    `Enable Withdrawals` permission should be given to the user''s API key to initiate transfers with Binance International. Binance requires adding the IP address to the list of trusted IPs to be able to create API keys with transfer permission. * Please reach out to Front to get the static IP address.'
paths:
  /api/v1/transfers/address/get:
    post:
      tags:
      - Transfers
      summary: Get deposit address
      description: Get or generate a cryptocurrency deposit address that can be used to transfer assets to the financial institution
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransfersBrokerCryptocurrencyDepositAddressRequest'
            example:
              symbol: DOGE
              chain: DOGE
              authToken: Secret authentication token
              type: robinhood
      responses:
        '200':
          description: Address successfully obtained or generation initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerCryptocurrencyDepositAddressResponseApiResult'
              example:
                content:
                  symbol: DOGE
                  address: D641Fmzx...
                  chain: DOGE
                status: ok
                message: ''
                errorHash: 010074a1
                teamCode: P4
                errorType: ''
        '400':
          description: Request details are not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                status: badRequest
                message: Error message
                displayMessage: Optional display message
                errorHash: 7dcbb73d
                teamCode: P4
                errorType: missingField
        '404':
          description: Address for the required symbol is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                status: notFound
                message: Error message
                displayMessage: Optional display message
                errorHash: 7dcbb73d
                teamCode: P4
                errorType: missingField
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or missing.'
          content:
            application/json:
              schema: {}
      operationId: postApiV1TransfersAddressGet
      x-operation-id-source: derived
components:
