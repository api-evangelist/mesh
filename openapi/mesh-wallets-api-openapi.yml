openapi: 3.2.0
info:
  title: Mesh Connect Integration Wallets API
  description: 'Mesh allows users to connect accounts of financial institutions,

    crypto exchanges, and self-custody wallets. Mesh handles credential

    validation, MFA, and error handling for each integration. After

    an account is connected, Mesh allows client applications to read holdings,

    transaction history and balances and execute crypto transfers (with user approval).'
  version: '1.0'
servers:
- url: https://integration-api.meshconnect.com
- url: https://sandbox-integration-api.meshconnect.com
security:
- Client-Secret: []
  Client-Id: []
tags:
- name: Wallets
paths:
  /api/v1/wallets/verify:
    get:
      tags:
      - Wallets
      summary: Get verified addresses
      parameters:
      - name: UserId
        in: query
        description: User identifier.
        schema:
          type: string
      - name: Address
        in: query
        description: Address of the wallet.
        schema:
          type: string
      responses:
        '200':
          description: Verifications obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeFiWalletVerificationResponseApiResult'
              example:
                content:
                  verifications:
                  - userId: user-1
                    address: address-1
                    networkType: evm
                    verificationMethod: signedMessage
                    message: Some test message
                    signedMessageHash: signature-1
                    timestamp: 1733896980
                  - userId: user-1
                    address: address-2
                    networkType: evm
                    verificationMethod: signedMessage
                    message: Some test message
                    signedMessageHash: signature-2
                    timestamp: 1733896980
                status: ok
                message: ''
                errorHash: bd540591
                teamCode: P4
                errorType: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                status: badRequest
                message: Error message
                displayMessage: Optional display message
                errorHash: 7dcbb73d
                teamCode: P4
                errorType: missingField
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or missing.'
          content:
            application/json:
              schema: {}
      operationId: getApiV1WalletsVerify
      x-operation-id-source: derived
  /api/v1/wallets/wallets-v2.json:
    get:
      tags:
      - Wallets
      summary: Get TON Connect compatible wallet list
      responses:
        '200':
          description: Wallets list obtained.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TonConnectWalletEntry'
      operationId: getApiV1WalletsWalletsV2Json
      x-operation-id-source: derived
components:
  schemas:
    ApiResult:
      type: object
      properties:
        status:
          enum:
          - ok
          - serverFailure
          - permissionDenied
          - badRequest
          - notFound
          - conflict
          - tooManyRequest
          - locked
          - unavailableForLegalReasons
          allOf:
          - $ref: '#/components/schemas/ApiResultStatus'
          readOnly: true
        message:
          type:
          - string
          - 'null'
          description: A message generated by the API
        displayMessage:
          type:
          - string
          - 'null'
          description: User-friendly display message that can be presented to the end user
        errorHash:
          type:
          - string
          - 'null'
          description: An error grouping hash from string components and caller information. Used by bugsnag on FE for correct error grouping
          readOnly: true
        teamCode:
          type:
          - string
          - 'null'
          description: 'Opaque team code for error routing. Resolved from exception origin or caller file path via CODEOWNERS.

            Format: 2-character code (e.g., "7K", "M2"). Use for alerting/routing, not display.'
          readOnly: true
        errorType:
          type:
          - string
          - 'null'
          description: 'Strictly-typed error type that is explaining the reason of an unsuccessful status of the operation.

            All possible error types are available in the documentation.'
        errorData:
          readOnly: true
      additionalProperties: false
    ApiResultStatus:
      enum:
      - ok
      - serverFailure
      - permissionDenied
      - badRequest
      - notFound
      - conflict
      - tooManyRequest
      - locked
      - unavailableForLegalReasons
      type: string
