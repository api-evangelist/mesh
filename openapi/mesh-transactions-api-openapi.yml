openapi: 3.2.0
info:
  title: Mesh Connect Integration Transactions API
  description: 'Mesh allows users to connect accounts of financial institutions,

    crypto exchanges, and self-custody wallets. Mesh handles credential

    validation, MFA, and error handling for each integration. After

    an account is connected, Mesh allows client applications to read holdings,

    transaction history and balances and execute crypto transfers (with user approval).'
  version: '1.0'
servers:
- url: https://integration-api.meshconnect.com
security:
- Client-Secret: []
  Client-Id: []
tags:
- name: Transactions
  description: '### Supported integrations:

    ```Robinhood```

    ```ETrade```

    ```Alpaca```

    ```WeBull```

    ```Stash```

    ```InteractiveBrokers```

    ```Public```

    ```Coinbase```

    ```Kraken```

    ```CoinbasePro```

    ```CryptoCom```

    ```Binance```

    ```Gemini```

    ```OkCoin```

    ```KuCoin```

    ```Etoro```

    ```CexIo```

    ```BinanceInternational```

    ```Bitstamp```

    ```GateIo```

    ```Okx```

    ```BitFlyer```

    ```Coinlist```

    ```Huobi```

    ```Bitfinex```

    ```KrakenDirect```

    ```Vanguard```

    ```BinanceInternationalDirect```

    ```Bybit```

    ```CoinbasePrime```


    ###…'
paths:
  /api/v1/transactions/list:
    post:
      tags:
      - Transactions
      summary: Get transactions
      description: Get transactions on the account - the paginated history of the executed orders along with the pending orders.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsB2BBrokerOrderListRequest'
            example:
              count: 20
              statuses:
              - success
              authToken: Secret authentication token
              type: robinhood
      responses:
        '200':
          description: Transactions obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerOrderListResponseApiResult'
              example:
                content:
                  transactions:
                  - id: 17EC1243-D91A-48B6-B0CE-ECFDB134F8A0
                    side: buy
                    symbol: AAPL
                    name: APPLE INC
                    assetType: option
                    paymentSymbol: USD
                    paymentType: fiat
                    amount: 1
                    price: 120
                    value: 120
                    createdTimestamp: 1653215676
                    updatedTimestamp: 1653215697
                    status: success
                    orderType: market
                    timeInForce: goodForDay
                    brokerType: robinhood
                    transactionType: order
                    optionDetails:
                      optionType: call
                      direction: buyToOpen
                      strikePrice: 200
                      expirationTimestamp: 1673215697
                      numberOfSharesInContract: 100
                      complexOrderStrategyType: NONE
                  - id: F9E932AE-A780-42F3-B887-82D888D594E5
                    side: sell
                    symbol: AAPL
                    name: APPLE INC
                    assetType: equity
                    paymentSymbol: USD
                    paymentType: fiat
                    amount: 2
                    price: 130
                    value: 260
                    createdTimestamp: 1651739676
                    updatedTimestamp: 1651739781
                    status: success
                    orderType: market
                    timeInForce: goodTillCanceled
                    brokerType: robinhood
                    transactionType: order
                  - id: 9B5827E4-7D08-4A71-B4C0-B1B4E5562592
                    side: buy
                    symbol: BTC
                    name: Bitcoin
                    assetType: cryptocurrency
                    paymentSymbol: ETH
                    paymentType: cryptocurrency
                    amount: 0.3
                    price: 18604.8197
                    value: 5581.44591
                    createdTimestamp: 1651739676
                    updatedTimestamp: 1651739781
                    status: success
                    orderType: limit
                    timeInForce: goodTillCanceled
                    brokerType: robinhood
                    transactionType: order
                  cursor: N2VkZDI0MDMtNmRhYy01NThhLTk5NDUDYzI12M3GQ3ZmQ2
                  total: 3
                  earliestTimestamp: 1651739676
                status: ok
                message: ''
                errorType: ''
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or provided integration token is not correct.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have read permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
      operationId: postApiV1TransactionsList
      x-operation-id-source: derived
  /api/v1/transactions/details:
    post:
      tags:
      - Transactions
      summary: Get transaction details
      description: Get details of an executed order. Typically used to poll the status of the previously executed order.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsB2BBrokerOrderRequest'
            example:
              id: 17EC1243-D91A-48B6-B0CE-ECFDB134F8A0
              isCryptocurrency: true
              authToken: Secret authentication token
              type: robinhood
      responses:
        '200':
          description: Transactions obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerOrderApiResult'
              example:
                id: 17EC1243-D91A-48B6-B0CE-ECFDB134F8A0
                side: buy
                symbol: AAPL
                assetType: equity
                paymentType: fiat
                amount: 1
                price: 120
                value: 120
                createdTimestamp: 1653215676
                updatedTimestamp: 1653215697
                status: success
                statusDetails: ''
                brokerType: robinhood
                transactionType: order
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or provided integration token is not correct.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have read permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
        '404':
          description: Transaction is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: postApiV1TransactionsDetails
      x-operation-id-source: derived
  /api/v1/transactions/featureList:
    post:
      tags:
      - Transactions
      summary: Get supported order features for institution
      description: 'Get supported features for trading for a particular financial institution. Different institutions support different

        features (e.g. different `OrderType` or different sets of `TimeInForce` values), so this endpoint is used to

        describe such features for provided financial institution.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsBrokerBaseRequest'
            example:
              authToken: Secret authentication token
              type: binanceInternationalDirect
      responses:
        '200':
          description: Feature list obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerTradingFeatureInfoApiResult'
              example:
                content:
                  brokerType: robinhood
                  accountId: 5K9N3VO1
                  cryptocurrencyOrders:
                    supported: true
                    supportsFiatCurrencyPayment: true
                    supportsCryptocurrencyPayment: false
                    supportsMarginOrders: true
                    supportedCryptocurrencySymbols:
                    - BTC
                    - ETH
                    - SOL
                    - DOGE
                    supportedFiatCurrencies:
                    - USD
                    marketType:
                      supported: true
                      supportsFractionalShares: true
                      supportsExtendedMarketHours: true
                      supportsPlacingBuyOrdersInFiatAmount: false
                      supportsPlacingSellOrdersInFiatAmount: false
                      supportedTimeInForceList:
                      - fillOrKill
                      - goodForDay
                      - goodTillCanceled
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInPaymentSymbolAmount: false
                      supportsPlacingSellOrdersInPaymentSymbolAmount: false
                      supportsPlacingBuyOrdersInBaseSymbolAmount: true
                      supportsPlacingSellOrdersInBaseSymbolAmount: true
                    limitType:
                      supported: true
                      supportsFractionalShares: true
                      supportsExtendedMarketHours: true
                      supportsPlacingBuyOrdersInFiatAmount: false
                      supportsPlacingSellOrdersInFiatAmount: false
                      supportedTimeInForceList:
                      - goodForDay
                      - goodTillCanceled
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInPaymentSymbolAmount: false
                      supportsPlacingSellOrdersInPaymentSymbolAmount: false
                      supportsPlacingBuyOrdersInBaseSymbolAmount: true
                      supportsPlacingSellOrdersInBaseSymbolAmount: true
                    stopLossType:
                      supported: true
                      supportsFractionalShares: true
                      supportsExtendedMarketHours: true
                      supportsPlacingBuyOrdersInFiatAmount: false
                      supportsPlacingSellOrdersInFiatAmount: false
                      supportedTimeInForceList:
                      - fillOrKill
                      - goodForDay
                      - goodTillCanceled
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInPaymentSymbolAmount: false
                      supportsPlacingSellOrdersInPaymentSymbolAmount: false
                      supportsPlacingBuyOrdersInBaseSymbolAmount: true
                      supportsPlacingSellOrdersInBaseSymbolAmount: true
                  stockOrders:
                    supported: true
                    supportsFiatCurrencyPayment: true
                    supportsCryptocurrencyPayment: false
                    supportsMarginOrders: true
                    supportedFiatCurrencies:
                    - USD
                    marketType:
                      supported: true
                      supportsFractionalShares: true
                      supportsExtendedMarketHours: true
                      supportsPlacingBuyOrdersInFiatAmount: false
                      supportsPlacingSellOrdersInFiatAmount: false
                      supportedTimeInForceList:
                      - fillOrKill
                      - goodForDay
                      - goodTillCanceled
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInPaymentSymbolAmount: false
                      supportsPlacingSellOrdersInPaymentSymbolAmount: false
                      supportsPlacingBuyOrdersInBaseSymbolAmount: false
                      supportsPlacingSellOrdersInBaseSymbolAmount: false
                    limitType:
                      supported: true
                      supportsFractionalShares: true
                      supportsExtendedMarketHours: true
                      supportsPlacingBuyOrdersInFiatAmount: false
                      supportsPlacingSellOrdersInFiatAmount: false
                      supportedTimeInForceList:
                      - goodForDay
                      - goodTillCanceled
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInPaymentSymbolAmount: false
                      supportsPlacingSellOrdersInPaymentSymbolAmount: false
                      supportsPlacingBuyOrdersInBaseSymbolAmount: false
                      supportsPlacingSellOrdersInBaseSymbolAmount: false
                    stopLossType:
                      supported: true
                      supportsFractionalShares: true
                      supportsExtendedMarketHours: true
                      supportsPlacingBuyOrdersInFiatAmount: false
                      supportsPlacingSellOrdersInFiatAmount: false
                      supportedTimeInForceList:
                      - fillOrKill
                      - goodForDay
                      - goodTillCanceled
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInPaymentSymbolAmount: false
                      supportsPlacingSellOrdersInPaymentSymbolAmount: false
                      supportsPlacingBuyOrdersInBaseSymbolAmount: false
                      supportsPlacingSellOrdersInBaseSymbolAmount: false
                  cryptocurrencyAssetPairTrading:
                    supported: true
                    supportedCryptocurrencySymbols:
                    - BTC
                    - ETH
                    - SOL
                    - DOGE
                    supportedFiatCurrencies:
                    - USD
                    supportedTradingPairs:
                    - BTC-ETH
                    - BTC-USD
                    - ETH-SOL
                    - ETH-USD
                    - SOL-USD
                    - DOGE-USD
                    marketType:
                      supported: true
                      supportedTimeInForceList:
                      - immediateOrCancel
                      supportsPlacingBuyOrdersInBaseSymbolAmount: false
