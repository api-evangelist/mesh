  /api/v1/transactions/preview/{side}:
    post:
      tags:
      - Transactions
      summary: Preview order execution
      description: 'Validates the order information (such as necessary balance availability), and returns additional information,

        such as expected order fee.

        Does not execute the order.'
      parameters:
      - name: side
        in: path
        required: true
        schema:
          enum:
          - unknown
          - buy
          - sell
          allOf:
          - $ref: '#/components/schemas/BrokerOrderType'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsB2BBrokerCreateOrderRequest'
            examples:
              Cryptocurrency Limit example:
                value:
                  symbol: ETH
                  paymentSymbol: USD
                  amount: 1
                  price: 1200
                  isCryptocurrency: true
                  paymentIsCryptocurrency: false
                  amountIsFiat: false
                  amountIsInPaymentSymbol: false
                  extendedHours: false
                  orderType: limit
                  timeInForce: goodForDay
                  authToken: Secret authentication token
                  type: robinhood
              Stock Market example:
                value:
                  symbol: AAPL
                  paymentSymbol: USD
                  amount: 1
                  price: 0
                  isCryptocurrency: false
                  paymentIsCryptocurrency: false
                  amountIsFiat: false
                  amountIsInPaymentSymbol: false
                  extendedHours: false
                  orderType: market
                  timeInForce: goodTillCanceled
                  authToken: Secret authentication token
                  type: robinhood
              Stock Payment/Quote amount example ('buy TSLA for $10'):
                value:
                  symbol: TSLA
                  paymentSymbol: USD
                  amount: 0
                  price: 0
                  isCryptocurrency: false
                  paymentIsCryptocurrency: false
                  amountIsFiat: true
                  amountInFiat: 10
                  amountIsInPaymentSymbol: true
                  amountInPaymentSymbol: 10
                  extendedHours: false
                  orderType: market
                  timeInForce: goodTillCanceled
                  authToken: Secret authentication token
                  type: robinhood
      responses:
        '200':
          description: Order preview obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerPreviewOrderResultApiResult'
              example:
                content:
                  brokerType: robinhood
                  fee: 1.99
                  feeText: ''
                  amount: 1
                  side: buy
                  status: success
                  paymentSymbol: USD
                  paymentIsCryptocurrency: false
                  estimatedUnitPrice: 1200
                status: ok
                message: ''
                errorType: ''
        '400':
          description: Request details are not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or provided integration token is not correct.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have write permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
      operationId: postApiV1TransactionsPreviewBySide
      x-operation-id-source: derived
  /api/v1/transactions/{side}:
    post:
      tags:
      - Transactions
      summary: Execute order
      description: 'Validates the order information and then calls institution''s API to execute an order.

        It''s recommended to call this endpoint after calling the `preview` endpoint to make sure that the

        order execution request is correct.'
      parameters:
      - name: side
        in: path
        required: true
        schema:
          enum:
          - unknown
          - buy
          - sell
          allOf:
          - $ref: '#/components/schemas/BrokerOrderType'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsB2BBrokerCreateOrderRequest'
            examples:
              Cryptocurrency Limit example:
                value:
                  symbol: ETH
                  paymentSymbol: USD
                  amount: 1
                  price: 1200
                  isCryptocurrency: true
                  paymentIsCryptocurrency: false
                  amountIsFiat: false
                  amountIsInPaymentSymbol: false
                  extendedHours: false
                  orderType: limit
                  timeInForce: goodForDay
                  authToken: Secret authentication token
                  type: robinhood
              Stock Market example:
                value:
                  symbol: AAPL
                  paymentSymbol: USD
                  amount: 1
                  price: 0
                  isCryptocurrency: false
                  paymentIsCryptocurrency: false
                  amountIsFiat: false
                  amountIsInPaymentSymbol: false
                  extendedHours: false
                  orderType: market
                  timeInForce: goodTillCanceled
                  authToken: Secret authentication token
                  type: robinhood
              Stock Payment/Quote amount example ('buy TSLA for $10'):
                value:
                  symbol: TSLA
                  paymentSymbol: USD
                  amount: 0
                  price: 0
                  isCryptocurrency: false
                  paymentIsCryptocurrency: false
                  amountIsFiat: true
                  amountInFiat: 10
                  amountIsInPaymentSymbol: true
                  amountInPaymentSymbol: 10
                  extendedHours: false
                  orderType: market
                  timeInForce: goodTillCanceled
                  authToken: Secret authentication token
                  type: robinhood
      responses:
        '200':
          description: Order executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerCreateOrderResultApiResult'
              example:
                content:
                  orderId: 6713DCDC-3D2E-46BC-ACB6-CF5FDE431CE2
                  brokerType: robinhood
                  side: buy
                  amount: 1
                  price: 1200
                  value: 1200
                  fee: 1.99
                  timestamp: 1661904014
                  status: success
                  statusDetails: Executed successfully
                  timeInForce: goodTillCanceled
                status: ok
                message: ''
                errorType: ''
        '400':
          description: Request details are not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or provided integration token is not correct.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have write permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
      operationId: postApiV1TransactionsBySide
      x-operation-id-source: derived
  /api/v1/transactions/cancel:
    post:
      tags:
      - Transactions
      summary: Cancel order execution
      description: 'Cancels a pending order (an order with `InProgress` status).

        `SymbolPair` is required to be provided for `Binance`, `BinanceInternational`, `Okx` and `BitFlyer` institutions.

        This value'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsB2BBrokerOrderRequest'
            example:
              id: 17EC1243-D91A-48B6-B0CE-ECFDB134F8A0
              isCryptocurrency: true
              authToken: Secret authentication token
              type: robinhood
      responses:
        '200':
          description: Order canceled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
        '400':
          description: Request details are not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct or provided integration token is not correct.'
          content:
            application/json:
              schema: {}
        '403':
          description: The API key used does not have write permission to call this Mesh endpoint.
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: postApiV1TransactionsCancel
      x-operation-id-source: derived
  /api/v1/transactions/symbolinfo:
    post:
      tags:
      - Transactions
      summary: Get symbol information
      description: 'Returns information on trading allowance for a provided symbol.

        For example - some institutions allow fractional trading for some symbols, but do not allow it

        for others. So before placing an order the API client can check if the required symbol can be traded fractionally

        with the provided institution.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransactionsB2BBrokerSymbolInfoForOrderRequest'
            example:
              side: buy
              symbol: BTC
              amount: 0
              price: 0
              isCryptocurrency: false
              paymentIsCryptocurrency: false
              amountIsFiat: false
              amountIsInPaymentSymbol: false
              extendedHours: false
              orderType: market
              timeInForce: goodTillCanceled
              type: robinhood
      responses:
        '200':
          description: Information for symbol obtained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/B2BBrokerOrderSymbolInfoApiResult'
              example:
                content:
                  fractionalTradingAllowance: fractionalTradingAllowed
                  minimumOrderValue: 0.001
                  precisionScale: 6
                status: ok
                message: ''
                errorType: ''
        '400':
          description: Request details are not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: 'Unauthorized: Client Id or Client Secret are not correct.'
          content:
            application/json:
              schema: {}
      operationId: postApiV1TransactionsSymbolinfo
      x-operation-id-source: derived
components:
  schemas:
    SymbolTradingAllowance:
      enum:
      - fractionalTradingAllowed
      - fractionalTradingNotAllowed
      - tradingNotAllowed
      - fractionalTradingPossiblyAllowed
      type: string
    BrokerOptionType:
      enum:
      - unknown
      - call
      - put
      type: string
    ApiResultStatus:
      enum:
      - ok
      - serverFailure
      - permissionDenied
      - badRequest
      - notFound
      - conflict
      - tooManyRequest
      - locked
      type: string
    B2BBrokerCreateOrderResult:
      type: object
      properties:
        orderId:
          type:
          - string
          - 'null'
          description: Id of the order, as returned from the financial institution. Can be used to get the status of the order.
        brokerType:
          enum:
          - robinhood
          - eTrade
          - alpaca
          - tdAmeritrade
          - weBull
          - stash
          - interactiveBrokers
          - public
          - coinbase
          - kraken
          - coinbasePro
          - cryptoCom
          - openSea
          - binanceUs
          - gemini
          - cryptocurrencyAddress
          - cryptocurrencyWallet
          - okCoin
          - bittrex
          - kuCoin
          - etoro
          - cexIo
          - binanceInternational
          - bitstamp
          - gateIo
          - acorns
          - okx
          - bitFlyer
          - coinlist
          - huobi
          - bitfinex
          - deFiWallet
          - krakenDirect
          - vanguard
          - binanceInternationalDirect
          - bitfinexDirect
          - bybit
          - paxos
          - coinbasePrime
          allOf:
          - $ref: '#/components/schemas/BrokerType'
          description: Type of the institution.
        side:
          enum:
          - unknown
          - buy
          - sell
          allOf:
          - $ref: '#/components/schemas/BrokerOrderType'
          description: Side of the order.
        amount:
          type: number
          description: Amount of the order.
          format: double
        price:
          type:
          - number
          - 'null'
          description: Unit price of the asset.
          format: double
        value:
          type:
          - number
          - 'null'
          description: Total value of the order.
          format: double
        fee:
          type:
          - number
          - 'null'
          description: Optional Fee taken by the financial institution.
          format: double
        timestamp:
          type: integer
          description: Timestamp of the order.
          format: int64
        status:
          enum:
          - unknown
          - inProgress
          - cancelled
          - rejected
          - failed
          - success
          - partiallyFilled
          - expired
          allOf:
          - $ref: '#/components/schemas/BrokerOrderStatus'
          description: Status of the order.
        statusDetails:
          type:
          - string
          - 'null'
          description: Text details of the order, if additionally returned from the financial institution.
        timeInForce:
          allOf:
          - $ref: '#/components/schemas/BrokerOrderTimeInForceType'
          description: Value that indicates how long the order will remain active before it is executed or expires.
        symbolPair:
          type:
          - string
          - 'null'
          description: Optional pair of symbols, as returned from the financial institution. Can be required to obtain the status of the order by some institutions.
        parentOrderId:
          type:
          - string
          - 'null'
          description: Id of the parent order, applicable to some institutions if the order was executed in several trades.
        trades:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/B2BBrokerOrderTrade'
          description: List of trades, provided only if the order was executed in several trades.
        errorMessage:
          type:
          - string
          - 'null'
          description: A message describing the error if the order wasn't placed.
        displayMessage:
          type:
          - string
          - 'null'
          description: A user-friendly display message that can be presented to the end user.
      additionalProperties: false
