                message: ''
                errorHash: 1cbbee0c
                teamCode: P4
                errorType: ''
      summary: Create api onramp sessions by session id initiate kyc
      x-summary-source: derived
      operationId: postApiV1OnrampSessionsBySessionIdInitiateKyc
      x-operation-id-source: derived
