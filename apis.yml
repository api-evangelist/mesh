aid: mesh
name: Mesh
description: >-
  Mesh is the first global crypto payments network, connecting hundreds of exchanges,
  wallets, and financial platforms into a single, unified infrastructure layer so
  businesses can let users pay, get paid, deposit, and transfer digital assets from
  any wallet on any chain. The Mesh Connect Integration API lets developers
  programmatically generate Link tokens for Mesh's hosted connection UX, initiate
  managed crypto transfers (deposit, payment, onramp, withdrawal), read holdings,
  balances, and transaction history across connected exchange and self-custody
  accounts, verify wallet ownership, and receive HMAC-signed transfer-status
  webhooks. Mesh handles credential validation, MFA, OAuth, and per-integration
  error handling on the developer's behalf. Formerly Front Finance. SOC 2 Type II
  certified. Backed by Anthemis and General Catalyst.
